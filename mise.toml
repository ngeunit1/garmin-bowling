# mise.toml — task runner + tool manager for garminbowling.
#
# Replaces the old Taskfile.yml (go-task). mise is preferred here because:
#   * it preserves task exit codes (go-task collapsed every failure to 201, so
#     "tests failed" and "simulator hung" were indistinguishable);
#   * tasks run in a real shell (file-based tasks are real bash), so trap/job
#     control work — go-task's embedded `gosh` interpreter could not do this.
#
# Full, line-by-line explanation of every command lives in .reference/TASKS.md
# (that directory is gitignored — it's personal notes, not part of the repo).
min_version = "2025.1.0"

[tools]
# Intentionally empty. go-task is gone. On the dev/self-hosted host the Connect IQ
# SDK already lives under ~/.Garmin/ConnectIQ; CI uses the public matco image, so
# nothing needs to be installed here. Add tools here only if that changes.

[env]
# Plain strings exported into every task's environment.
APP_NAME     = "garminbowling"
DEVICE       = "fr970"
JAVA_OPTIONS = "-Xms1g -Dfile.encoding=UTF-8"   # JVM heap + UTF-8 source encoding
TEST_TIMEOUT = "180"                            # seconds; hard cap per test run (hang guard)

[tasks.build]
description = "Compile the shippable garminbowling.prg (no display needed)"
# Incremental: skip the rebuild unless one of these inputs is newer than the output.
sources = ["source/**/*.mc", "resources/**/*", "manifest.xml", "monkey.jungle"]
outputs = ["bin/garminbowling.prg"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# current-sdk.cfg holds the SDK path (with a trailing slash); strip trailing slash(es).
SDK="$(sed 's:/*$::' < "$HOME/.Garmin/ConnectIQ/current-sdk.cfg")"
KEY="$HOME/.keys/garmin/developer_key"
mkdir -p bin
java $JAVA_OPTIONS -jar "$SDK/bin/monkeybrains.jar" \
  -o "bin/${APP_NAME}.prg" -f monkey.jungle -y "$KEY" -d "${DEVICE}_sim" -w
'''

[tasks.build-test]
description = "Compile the unit-test binary garminbowling_test.prg (adds -t)"
sources = ["source/**/*.mc", "test/**/*", "resources/**/*", "manifest.xml", "monkey.jungle"]
outputs = ["bin/garminbowling_test.prg"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
SDK="$(sed 's:/*$::' < "$HOME/.Garmin/ConnectIQ/current-sdk.cfg")"
KEY="$HOME/.keys/garmin/developer_key"
mkdir -p bin
java $JAVA_OPTIONS -jar "$SDK/bin/monkeybrains.jar" \
  -o "bin/${APP_NAME}_test.prg" -f monkey.jungle -y "$KEY" -d "${DEVICE}_sim" -w -t
'''

# NOTE: the `test` task is the FILE-BASED task mise-tasks/test (real bash + full
# job control for the simulator orchestration). Do NOT add a [tasks.test] block
# here — two tasks named "test" would conflict. Its dependency on build-test is
# declared in that file's `#MISE depends=[...]` header.

[tasks.run]
description = "Build, then launch the app in the simulator (needs a DISPLAY)"
depends = ["build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
SDK="$(sed 's:/*$::' < "$HOME/.Garmin/ConnectIQ/current-sdk.cfg")"
# Launch the simulator detached (own session) so this task isn't blocked by it.
setsid "$SDK/bin/simulator" >/tmp/ciq-run.log 2>&1 </dev/null &
# Wait until the X display answers AND the sim has started logging, then push.
for _ in $(seq 1 60); do xdpyinfo >/dev/null 2>&1 && [ -s /tmp/ciq-run.log ] && break; sleep 0.5; done
"$SDK/bin/monkeydo" "bin/${APP_NAME}.prg" "$DEVICE"
'''
