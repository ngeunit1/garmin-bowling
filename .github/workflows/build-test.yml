name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ngeunit1/garmin-docker:v0.0.3
      options: --user root
      credentials:
        username: ngeunit1
        password: ${{ secrets.DOCKER_CONTAINER_REGISTRY_TOKEN }}
    env:
      HOME: /root
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run build
      run: task build
  test:
    runs-on: ubuntu-latest
    container:
      image: ngeunit1/garmin-docker:v0.0.3
      options: --user root
      credentials:
        username: ngeunit1
        password: ${{ secrets.DOCKER_CONTAINER_REGISTRY_TOKEN }}
    env:
      HOME: /root
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run test
      run: task test
  
    
