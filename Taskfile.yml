# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  APP_NAME: garminbowling
  DEVICE: fr970
  GARMIN_SDK: 
    sh: cat ~/.Garmin/ConnectIQ/current-sdk.cfg
  JAVA_OPTIONS: -Xms1g -Dfile.encoding=UTF-8 -Dapple.awt.UIElement=true
  PRIVATE_KEY: ~/.keys/garmin/developer_key

tasks:
  build-cmd:
    internal: true
    cmds:
      - java {{.JAVA_OPTIONS}} -jar "{{.GARMIN_SDK}}bin/monkeybrains.jar" 
            -o bin/{{.PRG_NAME}}.prg -f monkey.jungle -y {{.PRIVATE_KEY}} 
            -d {{.DEVICE}}_sim -w {{.TEST_FLAG}}
  build:
    cmds: 
      - task: build-cmd
        vars:
          PRG_NAME: "{{.APP_NAME}}"
          TEST_FLAG: ""
  test:
    cmds:
      - task: build-cmd
        vars:
          PRG_NAME: "{{.APP_NAME}}_test"
          TEST_FLAG: "-t"
      - "{{.GARMIN_SDK}}/bin/connectiq &"
      - sleep 3
      - "./runtests.sh '{{.GARMIN_SDK}}/bin/monkeydo bin/{{.APP_NAME}}_test.prg {{.DEVICE}} -t'"
  run:
    deps: [build]
    cmds:
      - "{{.GARMIN_SDK}}/bin/connectiq &"
      - sleep 3
      - "{{.GARMIN_SDK}}/bin/monkeydo bin/{{.APP_NAME}}.prg {{.DEVICE}}"

