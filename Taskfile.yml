# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  APP_NAME: garminbowling
  DEVICE: fr970
  GARMIN_SDK: 
    sh: cat ~/.Garmin/ConnectIQ/current-sdk.cfg
  JAVA_OPTIONS: -Xms1g -Dfile.encoding=UTF-8 -Dapple.awt.UIElement=true
  PRIVATE_KEY: ~/.keys/garmin/developer_key

tasks:
  build-cmd:
    internal: true
    cmds:
      - java {{.JAVA_OPTIONS}} -jar "{{.GARMIN_SDK}}bin/monkeybrains.jar" 
            -o bin/{{.PRG_NAME}}.prg -f monkey.jungle -y {{.PRIVATE_KEY}} 
            -d {{.DEVICE}}_sim -w {{.TEST_FLAG}}
  build:
    cmds: 
      - task: build-cmd
        vars:
          PRG_NAME: "{{.APP_NAME}}"
          TEST_FLAG: ""
  test:
    cmds:
      - task: build-cmd
        vars:
          PRG_NAME: "{{.APP_NAME}}_test"
          TEST_FLAG: "-t"
      - |
          CONNECTIQ_BIN="{{.GARMIN_SDK}}/bin/connectiq"
          CONNECTIQ_LOG=/tmp/connectiq.log
          CONNECTIQ_PID=""
          XVFB_PID=""

          cleanup() {
            pkill -TERM -f "$CONNECTIQ_BIN" || true
            pkill -TERM -f '/simulator([[:space:]]|$)' || true
            sleep 2
            pkill -KILL -f "$CONNECTIQ_BIN" || true
            pkill -KILL -f '/simulator([[:space:]]|$)' || true
            if [ -n "$XVFB_PID" ]; then
              kill -TERM "$XVFB_PID" 2>/dev/null || true
              sleep 1
              kill -KILL "$XVFB_PID" 2>/dev/null || true
            fi
          }

          if [ -z "${DISPLAY:-}" ]; then
            nohup Xvfb :99 -screen 0 1024x768x24 -nolisten tcp >/tmp/xvfb-task.log 2>&1 &
            XVFB_PID="$!"
            export DISPLAY=:99
            sleep 1
          fi

          "$CONNECTIQ_BIN" >"$CONNECTIQ_LOG" 2>&1 &
          CONNECTIQ_PID="$!"
          sleep 3

          if ./runtests.sh "{{.GARMIN_SDK}}/bin/monkeydo bin/{{.APP_NAME}}_test.prg {{.DEVICE}} -t"; then
            result=0
          else
            result=$?
          fi

          cleanup
          exit "$result"
  run:
    deps: [build]
    cmds:
      - "{{.GARMIN_SDK}}/bin/connectiq &"
      - sleep 3
      - "{{.GARMIN_SDK}}/bin/monkeydo bin/{{.APP_NAME}}.prg {{.DEVICE}}"

